experiment:
  exp_id: exp_kp_001
  n_items_list: [100]
  instances: 5
  runs_per_instance: 3


  weight_low: 1
  weight_high: 50
  value_low: 1
  value_high: 100
  capacity_ratio: 0.5        # capacity = ratio * sum(weights)

  penalty_lambda: 1000.0     
  feasible_only: true        # if true, repair solutions to feasibility

  run_csv: runs_knapsack_ga_c2.csv
  trace_csv: trace_knapsack_ga_c2.csv
  code_version: ""

# algos: [SA_KP, GA_KP, HC_KP, TLBO_KP, ABC_KP]
algos: [GA_KP]

SA_KP:
  T0: 1000.0
  Tmin: 0.001
  alpha: 0.99
  max_iter: 50000
  trace_every: 200
  flip_k: 1                  # bit-flip count per neighbor (optional)

GA_KP:
  population_size: 100
  generations: 99
  crossover_rate: 0.9
  mutation_rate: 0.02
  tournament_k: 5
  trace_every: 10

HC_KP:
  max_iter: 50000
  mode: first                # first | best
  trace_every: 200
  flip_k: 1

TLBO_KP:
  pop_size: 50
  iters: 500
  trace_every: 10

ABC_KP:
  sn: 500                      # number of food sources
  iters: 500
  limit: 100
  trace_every: 10
  flip_k: 1