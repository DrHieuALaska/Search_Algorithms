experiment:
  exp_id: exp_gc_sweep_001
  n_nodes_list: [30]          # do sweeps on one size first
  n_colors: 4
  edge_prob: 0.2
  ensure_connected: false

  instances: 10
  runs_per_instance: 10

  budget_evals: 50000
  run_csv: runs_graphcolor_sweep.csv
  trace_csv: trace_graphcolor_sweep.csv
  code_version: ""

algos: [SA_GC, GA_GC, HC_GC, ACO_GC, DFS_GC]

# Base params
SA_GC:
  Tmin: 0.001
  trace_every: 200

GA_GC:
  population_size: 100
  crossover_rate: 0.9
  trace_every: 10

HC_GC:
  trace_every: 200

ACO_GC:
  n_ants: 30
  alpha: 1.0
  Q: 1.0
  trace_every: 10
  deposit_best_only: true

DFS_GC:
  time_limit_sec: 2.0
  max_backtracks: 2000000
  trace_every: 10000

# Two impactful parameters per algorithm
sweeps:
  SA_GC:
    alpha: [0.95, 0.97, 0.99, 0.995]
    T0:    [1.0, 5.0, 10.0, 20.0]

  GA_GC:
    mutation_rate: [0.005, 0.01, 0.02, 0.05]
    tournament_k:  [2, 5, 10, 20]

  HC_GC:
    mode: [first, best]
    max_iter: [10000, 50000]   # budget-ish sensitivity

  ACO_GC:
    rho:  [0.05, 0.1, 0.2, 0.3]
    beta: [1.0, 2.0, 3.0, 5.0]

  DFS_GC:
    time_limit_sec: [0.5, 1.0, 2.0, 5.0]
    max_backtracks: [200000, 500000, 2000000]
