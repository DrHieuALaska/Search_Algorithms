experiment:
  exp_id: exp_kp_sweep_001
  n_items_list: [100]      # recommended for sensitivity
  instances: 5
  runs_per_instance: 3

  weight_low: 1
  weight_high: 50
  value_low: 1
  value_high: 100
  capacity_ratio: 0.5

  budget_evals: 50000           # normalize effort target (approx)
  penalty_lambda: 1000.0
  feasible_only: true

  run_csv: runs_knapsack_sweep.csv
  trace_csv: trace_knapsack_sweep.csv
  code_version: ""

# algos: [SA_KP, GA_KP, HC_KP, TLBO_KP, ABC_KP]
algos: [ABC_KP]
# Base params
SA_KP:
  alpha: 0.99
  Tmin: 0.001
  trace_every: 200
  flip_k: 1

GA_KP:
  population_size: 100
  generation: 500
  crossover_rate: 0.8
  mutation_rate: 0.02
  tournament_k: 5
  trace_every: 10

HC_KP:
  flip_k: 5
  trace_every: 200

TLBO_KP:
  iters: 500
  pop_size: 50
  trace_every: 10

ABC_KP:
  sn: 50
  trace_every: 10
  flip_k: 1

# 2 impactful params per algo
sweeps:
  SA_KP:
    alpha: [0.8, 0.95, 0.99, 0.995]
    T0: [10, 100, 500, 1000]

  GA_KP:
    tournament_k: [3, 5, 10, 20]

  HC_KP:
    mode:   [first, best]

  TLBO_KP:
    move_prob: [0.2, 0.4, 0.6, 0.8]   # probability of moving towards teacher vs random

  ABC_KP:
    limit: [10, 25, 50, 100]