experiment:
  exp_id: exp_001
  n_list: [5, 15, 30]
  instances: 10
  runs_per_instance: 10
  scale: 100.0

  run_csv: runs.csv
  trace_csv: trace.csv
  code_version: ""

algos: [SA, TLBO, GA, HC, ACO]

SA:
  T0: 100.0
  Tmin: 0.001
  alpha: 0.99
  steps_per_temp: 2000
  max_iter: 50000
  trace_every: 200

TLBO:
  pop_size: 50
  iters: 500
  trace_every: 10

GA:
  population_size: 100
  generations: 400
  mutation_rate: 0.2
  tournament_k: 10
  trace_every: 10

HC:
  max_iter: 50000
  mode: first   # first | best
  trace_every: 200

ACO:
  n_ants: 30
  iters: 1667
  alpha: 1.0
  beta: 3.0
  rho: 0.1
  Q: 100.0
  trace_every: 10
  deposit_best_only: false